# Builds the Windows x64 installer for an Amu release and publishes the release.
#
# scripts/amu-release.mjs --publish creates the release as a draft with the Mac
# assets and then dispatches this workflow. The release stays a draft until the
# Windows installer and latest.yml are on it, so Windows updaters never see a
# release without its feed. If this fails, publish the Mac-only release by hand:
#
#   gh release edit v<version> --repo yuupapa/amu --draft=false --latest
#
# This file must be on the default branch (amu) for workflow_dispatch to find it.
name: Amu Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.0.57. The draft release must already exist."
        type: string
        required: true
      commit:
        description: "Commit the tag points at."
        type: string
        required: true
      dry_run:
        description: "Build only and keep the installer as a workflow artifact; leave the release alone."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: amu-windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # .repos holds orphaned gitlinks that break actions/checkout's submodule
      # cleanup, so check out by hand (as release-desktop.yml does). The
      # repository is public, so Git needs no credentials.
      - name: Checkout
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$COMMIT"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Check version matches tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::apps/desktop is $version, but the tag is $TAG."
            exit 1
          fi

      # setup-vp's cache restores a Linux-shaped store on Windows (see windows-tests.yml).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # The resource monitor links against the Spectre-mitigated MSVC runtime.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # Signing turns on only when all Azure Trusted Signing secrets are set on
      # yuupapa/amu (see docs/operations/release.md); until then builds are unsigned.
      - name: Prepare Azure Trusted Signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      # The publish config makes electron-builder write latest.yml and the
      # app's app-update.yml.
      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: yuupapa/amu
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(--platform win --target nsis --arch x64 --output-dir release --verbose)
          if [[ -n "$AZURE_TENANT_ID" && -n "$AZURE_CLIENT_ID" && -n "$AZURE_CLIENT_SECRET" \
            && -n "$AZURE_TRUSTED_SIGNING_ENDPOINT" && -n "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
            && -n "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
            && -n "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME" ]]; then
            echo "Windows signing enabled (Azure Trusted Signing)."
            args+=(--signed)
          else
            echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Keep the installer as a workflow artifact
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: amu-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      # Dry runs also install the build on this runner beside upstream T3 Code
      # and check what a user would: Amu installs and registers as Amu in its
      # own folder, starts on 5233 with its data in %APPDATA%\Amu\runtime (not
      # ~/.t3), runs at the same time as T3 Code, and its uninstall leaves both
      # its data and T3 Code in place.
      - name: Smoke test the installer
        if: inputs.dry_run
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          T3CODE_DISABLE_AUTO_UPDATE: "true"
        run: |
          $ErrorActionPreference = "Stop"
          function Wait-Listener([scriptblock]$match, [string]$what) {
            $deadline = (Get-Date).AddMinutes(4)
            do {
              Start-Sleep -Seconds 3
              $found = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object $match | Select-Object -First 1
            } until ($found -or (Get-Date) -gt $deadline)
            if (-not $found) { throw "$what was not listening within 4 minutes." }
            Write-Host "$what listens on $($found.LocalPort): $((Get-Process -Id $found.OwningProcess).Path)"
            return $found
          }

          gh release download --repo pingdotgg/t3code --pattern "T3-Code-*-x64.exe" --dir upstream
          $upstreamInstaller = Get-ChildItem upstream -Filter "T3-Code-*-x64.exe" | Select-Object -First 1
          Start-Process $upstreamInstaller.FullName -ArgumentList "/S" -Wait
          $upstreamApp = Get-ChildItem "$env:LOCALAPPDATA\Programs\t3code" -Filter "*.exe" |
            Where-Object { $_.Name -notlike "Uninstall*" } | Select-Object -First 1
          if (-not $upstreamApp) { throw "Upstream T3 Code did not install to Programs\t3code." }
          Write-Host "Upstream T3 Code: $($upstreamApp.FullName)"

          $installer = Get-ChildItem release -Filter "Amu-*-x64.exe" | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter "Amu.exe" | Select-Object -First 1
          if (-not $app) { throw "Amu.exe was not installed under $env:LOCALAPPDATA\Programs." }
          Write-Host "Installed: $($app.FullName)"
          # Upstream T3 Code installs to Programs\t3code; sharing it would overwrite each other.
          if ($app.Directory.Name -ne "amu") { throw "Installed under $($app.DirectoryName), not Programs\amu." }
          if (-not (Test-Path $upstreamApp.FullName)) { throw "Installing Amu removed upstream T3 Code." }
          $entries = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          $entry = $entries | Where-Object { $_.DisplayName -like "Amu*" } | Select-Object -First 1
          if (-not $entry) { throw "No uninstall entry named Amu." }
          $entries | Where-Object { $_.DisplayName } | ForEach-Object { Write-Host "Uninstall entry: $($_.PSChildName) $($_.DisplayName) $($_.DisplayVersion)" }

          $amu = Start-Process $app.FullName -PassThru
          $null = Wait-Listener { $_.LocalPort -eq 5233 } "Amu"
          $runtime = Join-Path $env:APPDATA "Amu\runtime"
          if (-not (Test-Path $runtime)) { throw "$runtime was not created." }
          Get-ChildItem $runtime -Depth 0 | Select-Object -ExpandProperty FullName
          if (Test-Path (Join-Path $env:USERPROFILE ".t3")) { throw "Amu wrote to ~/.t3, upstream T3 Code's folder." }

          $upstream = Start-Process $upstreamApp.FullName -PassThru
          $upstreamDir = $upstreamApp.DirectoryName
          $null = Wait-Listener { $_.LocalPort -ne 5233 -and (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path -like "$upstreamDir\*" } "Upstream T3 Code"
          if (-not (Get-NetTCPConnection -LocalPort 5233 -State Listen -ErrorAction SilentlyContinue)) { throw "Amu stopped listening once T3 Code started." }
          if ($amu.HasExited) { throw "Amu exited once T3 Code started." }
          Write-Host "Amu and upstream T3 Code run side by side."

          # Stop only the process trees this step started.
          taskkill /PID $amu.Id /T /F | Out-Null
          taskkill /PID $upstream.Id /T /F | Out-Null
          Start-Sleep -Seconds 5
          $uninstaller = Join-Path $app.DirectoryName "Uninstall Amu.exe"
          Start-Process $uninstaller -ArgumentList "/S" -Wait
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $app.FullName) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (Test-Path $app.FullName) { throw "Uninstall left $($app.FullName) behind." }
          if (-not (Test-Path $runtime)) { throw "Uninstall removed $runtime." }
          if (-not (Test-Path $upstreamApp.FullName)) { throw "Uninstalling Amu removed upstream T3 Code." }
          Write-Host "Uninstalled Amu; $runtime and upstream T3 Code are still there."

      - name: Upload to the draft release and publish it
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/Amu-${version}-x64.exe" \
            "release/Amu-${version}-x64.exe.blockmap" \
            "release/latest.yml"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
