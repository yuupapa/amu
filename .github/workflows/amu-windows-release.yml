# Builds the Windows x64 installer for an Amu release and publishes the release.
#
# scripts/amu-release.mjs --publish creates the release as a draft with the Mac
# assets and then dispatches this workflow. The release stays a draft until the
# Windows installer and latest.yml are on it, so Windows updaters never see a
# release without its feed. If this fails, publish the Mac-only release by hand:
#
#   gh release edit v<version> --repo yuupapa/amu --draft=false --latest
#
# This file must be on the default branch (amu) for workflow_dispatch to find it.
name: Amu Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.0.57. The draft release must already exist."
        type: string
        required: true
      commit:
        description: "Commit the tag points at."
        type: string
        required: true
      dry_run:
        description: "Build only and keep the installer as a workflow artifact; leave the release alone."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: amu-windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # .repos holds orphaned gitlinks that break checkout's submodule cleanup.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check version matches tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::apps/desktop is $version, but the tag is $TAG."
            exit 1
          fi

      # setup-vp's cache restores a Linux-shaped store on Windows (see windows-tests.yml).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # The resource monitor links against the Spectre-mitigated MSVC runtime.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # Unsigned until a Windows code signing setup exists. The publish config
      # makes electron-builder write latest.yml and the app's app-update.yml.
      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: yuupapa/amu
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform win \
            --target nsis \
            --arch x64 \
            --output-dir release \
            --verbose

      - name: Keep the installer as a workflow artifact
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: amu-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Upload to the draft release and publish it
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/Amu-${version}-x64.exe" \
            "release/Amu-${version}-x64.exe.blockmap" \
            "release/latest.yml"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
